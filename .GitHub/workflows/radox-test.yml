name: Radox API Diagnostic and Model Comparison

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Optional exact model ID. If set, only that model is tested."
        required: false
        type: string
      compare_models:
        description: "Compare up to four known candidate models (may make extra API calls)."
        required: true
        default: true
        type: boolean
      extended_tests:
        description: "Also test JSON mode, streaming and tool calling (extra API calls)."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  radox-api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: python -m pip install --upgrade pip requests
      - name: Run diagnostics (test-only)
        env:
          RADOXAI_API_KEY: ${{ secrets.RADOXAI_API_KEY }}
          RADOX_MODEL_ID: ${{ inputs.model_id }}
          RADOX_COMPARE_MODELS: ${{ inputs.compare_models }}
          RADOX_EXTENDED_TESTS: ${{ inputs.extended_tests }}
        run: python radox_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radox-api-test-report
          path: output/
          if-no-files-found: warn
          retention-days: 7
